    - name: Get id output
      command: id
      register: id_output
      changed_when: false

    - name: Display id output
      debug:
        var: id_output.stdout

    - name: Get uname -a output
      command: uname -a
      register: uname_output
      changed_when: false

    - name: Display uname output
      debug:
        var: uname_output.stdout

    - name: Run local_ips.py on managed hosts
      ansible.builtin.script:
        cmd: files/local_ips.py
        executable: python3
      register: ip_output
      changed_when: false

    - name: Display IP addresses
      ansible.builtin.debug:
        msg: "{{ ip_output.stdout_lines }}"
